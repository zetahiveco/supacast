{% extends "base.html" %}

{% block title %}{{ page.title }} · {{ config.title }}{% endblock %}

{% block content %}
<article class="doc-page">
  <header class="doc-header">
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="doc-desc">{{ page.description }}</p>{% endif %}
  </header>
  <div class="doc-body">
    {{ page.content | safe }}
  </div>
</article>
{% endblock %}
