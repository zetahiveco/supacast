[package]
name = "supacast"
version = "0.2.0"
description = "Supacast - a fast launcher for apps and files (pure Rust egui)"
authors = ["Harish"]
edition = "2021"

[dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "multipart",
    "rustls-tls",
] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
enigo = "0.3"
cpal = "0.18"
# Audio decoding for the dictation player: m4a/aac recordings from the old
# Tauri app, plus mp3/ogg; wav stays on the hand-rolled decoder.
symphonia = { version = "0.5", default-features = false, features = [
    "aac",
    "alac",
    "isomp4",
    "mp3",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
] }
arboard = "3"
notify-rust = "4"
global-hotkey = "0.8"
tray-icon = "0.26"
auto-launch = "0.6"
single-instance = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSImage",
    "NSResponder",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "NSGraphics",
] }
objc2-foundation = { version = "0.3", features = [
    "NSData",
    "NSString",
    "NSArray",
    "NSGeometry",
    "objc2-core-foundation",
] }
block2 = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
